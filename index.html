<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ветер ТВ — Тест Безопасности</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }
        h1 {
            font-size: 3rem;
            margin-top: 10px;
            margin-bottom: 20px;
            color: #38bdf8;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            letter-spacing: 2px;
        }
        .main-layout {
            display: flex;
            max-width: 1150px;
            margin: 0 auto;
            gap: 24px;
            justify-content: center;
            align-items: flex-start;
        }
        .left-block {
            flex: 1;
            max-width: 780px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .live-badge {
            background-color: #ef4444;
            color: white;
            padding: 4px 10px;
            font-weight: bold;
            border-radius: 4px;
            font-size: 0.9rem;
            display: inline-block;
            align-self: center;
            text-transform: uppercase;
            animation: blink 1.5s infinite;
        }
        @keyframes blink { 50% { opacity: 0.5; } }
        .subtitle { font-size: 1.2rem; color: #94a3b8; font-weight: 500; margin: 0; }
        
        .video-container {
            position: relative;
            width: 100%;
            height: 440px; 
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .video-mask { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; background: transparent; }
        iframe { width: 100% !important; height: 440px !important; border: none; display: block; }
        
        .controls { display: flex; justify-content: center; gap: 15px; }
        .btn {
            background-color: #0284c7; color: white; border: none; padding: 10px 20px;
            font-size: 0.95rem; font-weight: 600; cursor: pointer; border-radius: 8px;
            transition: all 0.2s ease;
        }
        .btn:hover { background-color: #0369a1; }
        
        /* НОВЫЙ БЛОК РЕГИСТРАЦИИ ПОД ПЛЕЕРОМ */
        .auth-panel {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 20px;
            border-radius: 12px;
            text-align: left;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .auth-panel h3 { margin: 0 0 15px 0; color: #38bdf8; font-size: 1.2rem; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        .auth-panel p { font-size: 0.9rem; color: #94a3b8; margin: 0 0 15px 0; }
        .form-inline {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-end;
        }
        .form-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 160px; }
        .form-group label { font-size: 0.8rem; color: #94a3b8; font-weight: 600; }
        .form-group input {
            background: #0f172a; border: 1px solid #334155; color: white;
            padding: 8px 12px; border-radius: 6px; outline: none; font-size: 0.9rem;
        }
        .submit-btn {
            background: #22c55e; color: white; border: none; padding: 9px 18px;
            border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.9rem;
            transition: background 0.2s; height: 36px;
        }
        .submit-btn:hover { background: #16a34a; }

        /* БЛОК АККАУНТА КОГДА ВОШЕЛ */
        .account-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            border: 1px solid #22c55e;
            padding: 12px 20px;
            border-radius: 12px;
            text-align: left;
        }
        
        /* Правый блок — Чат */
        .chat-container {
            width: 330px;
            height: 560px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        .chat-header {
            background: #0f172a;
            padding: 12px;
            font-weight: bold;
            color: #38bdf8;
            border-bottom: 1px solid #334155;
            text-align: left;
        }
        .chat-messages {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
            font-size: 0.9rem;
        }
        .chat-lock-overlay {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(15, 23, 42, 0.6);
            color: #94a3b8;
            font-size: 0.9rem;
            padding: 25px;
            text-align: center;
            line-height: 1.4;
        }
        .chat-input-area {
            padding: 12px;
            border-top: 1px solid #334155;
            background: #0f172a;
            display: flex;
            gap: 6px;
        }
        .chat-input {
            flex: 1;
            background: #1e293b;
            border: 1px solid #334155;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
        }
        .online-counter {
            margin-top: 5px; font-size: 1.1rem; color: #94a3b8; background: #1e293b;
            display: inline-block; padding: 6px 16px; border-radius: 20px; border: 1px solid #334155;
            align-self: center;
        }
        .online-number { color: #22c55e; font-weight: bold; }
        .msg-author { font-weight: bold; color: #38bdf8; }
    </style>

    <!-- Скрипты EmailJS и Firebase -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
</head>
<body>

    <h1>Ветер ТВ — Тест</h1>

    <div class="main-layout">
        <!-- ЛЕВАЯ КОЛОНКА: ПЛЕЕР, КНОПКИ, РЕГИСТРАЦИЯ -->
        <div class="left-block">
            <div class="live-badge">Тестовый эфир</div>
            <div class="subtitle" id="currentTrack">Загрузка эфира...</div>

            <div class="video-container" id="videoContainer">
                <div class="video-mask"></div>
                <iframe id="tv-player" allow="autoplay; fullscreen" allowfullscreen></iframe>
            </div>

            <div class="controls">
                <button class="btn" id="muteBtn">🔇 Включить звук</button>
                <button class="btn" id="fullscreenBtn">📺 Полный экран</button>
            </div>

            <!-- ИНТЕРФЕЙС АВТОРИЗАЦИИ СТРОГО НА УРОВНЕ ПЛЕЕРА -->
            <div id="authContainer">
                <!-- ШАГ 1: Форма ввода данных (показывается по умолчанию) -->
                <div class="auth-panel" id="authStep1Panel">
                    <h3>🔐 Авторизация телеканала Ветер ТВ</h3>
                    <p>Чтобы комментировать эфиры, зарегистрируйтесь или войдите в свой аккаунт:</p>
                    <div class="form-inline">
                        <div class="form-group">
                            <label>Почта:</label>
                            <input type="email" id="authEmail" placeholder="example@mail.ru" required>
                        </div>
                        <div class="form-group">
                            <label>Никнейм:</label>
                            <input type="text" id="authNick" placeholder="Твой ник в чате" required>
                        </div>
                        <div class="form-group">
                            <label>Пароль:</label>
                            <input type="password" id="authPass" placeholder="••••••••" required>
                        </div>
                        <button class="submit-btn" id="nextStepBtn">Получить код</button>
                    </div>
                </div>

                <!-- ШАГ 2: Ввод секретного кода (скрыт по умолчанию) -->
                <div class="auth-panel" id="authStep2Panel" style="display: none;">
                    <h3>📧 Подтверждение безопасности</h3>
                    <p>На указанную почту отправлен секретный 4-значный код от Ветер ТВ. Введите его для защиты профиля:</p>
                    <div class="form-inline" style="justify-content: flex-start; gap: 15px;">
                        <div class="form-group" style="flex: 0 0 150px;">
                            <label>Код из письма:</label>
                            <input type="text" id="authCode" placeholder="0000" maxlength="4" style="text-align: center; font-weight: bold; letter-spacing: 3px;">
                        </div>
                        <button class="submit-btn" id="confirmCodeBtn" style="background: #38bdf8;">Войти в аккаунт</button>
                        <button class="btn" id="backToStep1" style="background: #475569; padding: 8px 15px; font-size: 0.9rem; border-radius: 6px;">Назад</button>
                    </div>
                </div>

                <!-- ШАГ 3: Статус успешного входа -->
                <div class="account-status" id="authSuccessPanel" style="display: none;">
                    <div>
