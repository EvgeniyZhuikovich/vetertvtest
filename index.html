<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ветер ТВ — Тестовый эфир с чатом</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            font-size: 3.5rem;
            margin-top: 10px;
            margin-bottom: 5px;
            color: #38bdf8;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            letter-spacing: 2px;
        }
        .live-badge {
            background-color: #ef4444;
            color: white;
            padding: 4px 10px;
            font-weight: bold;
            border-radius: 4px;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 10px;
            text-transform: uppercase;
            animation: blink 1.5s infinite;
        }
        @keyframes blink { 50% { opacity: 0.5; } }
        .subtitle { font-size: 1.2rem; color: #94a3b8; margin-bottom: 25px; font-weight: 500; }
        
        /* Главная сетка сайта */
        .main-broadcast-layout {
            display: flex;
            max-width: 1200px;
            margin: 0 auto;
            gap: 20px;
            justify-content: center;
            align-items: flex-start;
        }

        .video-container {
            position: relative;
            flex: 1;
            max-width: 850px;
            height: 480px; 
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .video-mask { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 30; background: transparent; }
        iframe { width: 100% !important; height: 480px !important; border: none; display: block; }
        
        /* Наш самописный чат */
        .chat-container {
            width: 340px;
            height: 480px;
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            text-align: left;
        }
        .chat-header {
            background: #334155;
            padding: 10px;
            font-weight: bold;
            color: #38bdf8;
            font-size: 1.1rem;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg {
            background: #111827;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            word-break: break-all;
        }
        .msg-author {
            color: #38bdf8;
            font-weight: bold;
            margin-right: 5px;
        }
        .chat-input-area {
            padding: 10px;
            background: #0f172a;
            border-top: 1px solid #334155;
            display: flex;
            gap: 8px;
        }
        .chat-input {
            flex: 1;
            background: #1e293b;
            border: 1px solid #334155;
            color: white;
            padding: 8px;
            border-radius: 6px;
            outline: none;
        }
        .chat-send-btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 0 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .chat-send-btn:hover { background: #0369a1; }

        /* Адаптивность для телефонов */
        @media (max-width: 1000px) {
            .main-broadcast-layout { flex-direction: column; align-items: center; }
            .chat-container { width: 100%; max-width: 850px; height: 400px; margin-top: 10px; }
        }

        /* Полный экран прячет чат */
        .video-container:fullscreen iframe {
            width: 100vw !important; height: 56.25vw !important; min-height: 100vh !important; min-width: 177.77vh !important;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
        .video-container:fullscreen .video-mask { width: 100vw !important; height: 100vh !important; position: absolute; top: 0; left: 0; }

        .controls { margin-top: 20px; display: flex; justify-content: center; gap: 15px; }
        .btn {
            background-color: #0284c7; color: white; border: none; padding: 12px 24px;
            font-size: 1rem; font-weight: 600; cursor: pointer; border-radius: 8px;
            transition: all 0.2s ease; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .btn:hover { background-color: #0369a1; transform: translateY(-1px); }
        .online-counter {
            margin-top: 35px; font-size: 1.3rem; color: #94a3b8; background: #1e293b;
            display: inline-block; padding: 8px 20px; border-radius: 20px; border: 1px solid #334155;
        }
        .online-number { color: #22c55e; font-weight: bold; text-shadow: 0 0 10px rgba(34, 197, 94, 0.2); }
    </style>
</head>
<body>

    <h1>Ветер ТВ</h1>
    <div class="live-badge">Прямой эфир</div>
    <div class="subtitle" id="currentTrack">Загрузка эфира...</div>

    <div class="main-broadcast-layout">
        <!-- Плеер -->
        <div class="video-container">
            <div class="video-mask"></div>
            <iframe id="tv-player" allow="autoplay; fullscreen" allowfullscreen></iframe>
        </div>

        <!-- Наш собственный чат -->
        <div class="chat-container">
            <div class="chat-header">💬 Чат трансляции</div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" class="chat-input" placeholder="Напишите сообщение..." maxlength="150">
                <button class="chat-send-btn" onclick="sendMessage()">➔</button>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn" id="muteBtn">🔇 Вкл звук</button>
        <button class="btn" id="fullscreenBtn">📺 Полный экран</button>
    </div>

    <div class="online-counter">
        • Онлайн: <span class="online-number" id="onlineCount">Загрузка...</span> чел.
    </div>

    <!-- Firebase СКРИПТЫ -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
        // Твои настройки school6by
        const firebaseConfig = {
            apiKey: "AIzaSyDs1PGAs9PlAifxph8FZYjjLrkwvttLTxE",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebaseio.com",
            projectId: "school6by",
            storageBucket: "school6by.firebasestorage.app",
            messagingSenderId: "295503050789",
            appId: "1:295503050789:web:4627c77bb0d7549da0e7cc"
        };
        
        let database;
        let myUsername = "";

        try {
            firebase.initializeApp(firebaseConfig);
            database = firebase.database();
            
            // 1. ЛОГИКА ОНЛАЙНА
            const onlineRef = database.ref('.info/connected');
            const myPresenceRef = database.ref('online_users').push();

            onlineRef.on('value', (snapshot) => {
                if (snapshot.val() === true) {
                    myPresenceRef.set(true);
                    myPresenceRef.onDisconnect().remove();
                }
            });

            database.ref('online_users').on('value', (snapshot) => {
                const count = snapshot.numChildren();
                document.getElementById('onlineCount').textContent = count || 1;
            });

            // 2. ЛОГИКА ЧАТА (Загрузка последних 50 сообщений из базы)
            database.ref('chat_messages').limitToLast(50).on('value', (snapshot) => {
                const chatBox = document.getElementById('chatMessages');
                chatBox.innerHTML = ""; // Очищаем перед обновлением
                
                snapshot.forEach((childSnapshot) => {
                    const data = childSnapshot.val();
                    const msgDiv = document.createElement('div');
                    msgDiv.className = 'msg';
                    msgDiv.innerHTML = `<span class="msg-author">${escapeHTML(data.name)}:</span>${escapeHTML(data.text)}`;
                    chatBox.appendChild(msgDiv);
                });
                // Авто-скролл вниз к новым сообщениям
                chatBox.scrollTop = chatBox.scrollHeight;
            });

        } catch(e) {
            document.getElementById('onlineCount').textContent = "1";
        }

        // Функция отправки сообщения в Firebase
        function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || !database) return;

            // Если у пользователя еще нет никнейма, генерируем случайный (например, Зритель_45)
            if (!myUsername) {
                const enteredName = prompt("Введите ваш ник для чата:", "");
                myUsername = enteredName ? enteredName.trim().substring(0, 15) : "Зритель_" + Math.floor(Math.random() * 100);
            }

            // Записываем сообщение в ветку chat_messages базы данных
            database.ref('chat_messages').push({
                name: myUsername,
                text: text,
                timestamp: Date.now()
            });

            input.value = ""; // Очищаем поле ввода
        }
