<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ветер ТВ — Стриминговая Платформа</title>
    <style>
        :root {
            --bg-main: #020617;
            --panel-bg: rgba(15, 23, 42, 0.45);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --text-main: #f8fafc;
        }

        body {
            background-color: var(--bg-main);
            background-image: radial-gradient(circle at 80% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                              radial-gradient(circle at 20% 80%, rgba(14, 165, 233, 0.15) 0%, transparent 50%);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Главная сетка в стиле Netflix/Twitch */
        .cinema-grid {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 24px;
            width: 100%;
            max-width: 1150px;
            padding: 30px;
            box-sizing: border-box;
        }

        @media (max-width: 900px) {
            .cinema-grid { grid-template-columns: 1fr; }
        }

        /* Левая часть: Плеер */
        .video-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
        }

        .main-theater {
            position: relative;
            background: #000;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px -15px rgba(0,0,0,0.8), 0 0 50px var(--accent-glow);
            aspect-ratio: 16/9;
            overflow: hidden;
            width: 100%;
        }

        .main-theater iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Прозрачный щит поверх плеера против кликов и пауз */
        .player-shield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            cursor: default;
        }

        /* Правая часть: Премиум Панель */
        .side-dashboard {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .station-info h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, #fff 40%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge-live {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .pulse-ring {
            width: 6px;
            height: 6px;
            background: #ef4444;
            border-radius: 50%;
            animation: live-glow 1.5s infinite;
        }

        @keyframes live-glow {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .meta-list {
            margin: 20px 0;
            padding: 0;
            list-style: none;
            font-size: 13px;
            color: #94a3b8;
        }

        .meta-list li {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            justify-content: space-between;
        }

        .meta-list strong { color: #f1f5f9; }

        .action-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            z-index: 20;
        }

        .btn-modern {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
            padding: 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-modern:hover {
            background: rgba(56, 189, 248, 0.08);
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
        }

        .btn-glow {
            background: linear-gradient(135deg, #0284c7 0%, #4f46e5 100%);
            border: none;
        }

        .btn-glow:hover {
            background: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
            color: #fff;
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.35);
        }
    </style>
</head>
<body>

    <div class="cinema-grid">
        <!-- Левый блок: Видео-плеер и защитный щит -->
        <div class="video-section">
            <div class="main-theater" id="playerContainer">
                <!-- Сюда динамически встанет плеер -->
            </div>
            <!-- Прозрачный щит блокирует клики внутри плеера -->
            <div class="player-shield"></div>
        </div>

        <!-- Правый блок: Инфо-Панель -->
        <div class="side-dashboard">
            <div class="station-info">
                <div class="badge-live">
                    <div class="pulse-ring"></div>
                    Эфир
                </div>
                <h1 style="margin-top: 12px;">Ветер ТВ</h1>
                
                <ul class="meta-list">
                    <li>Сейчас в эфире: <strong id="currentShowTitle">Синхронизация...</strong></li>
                    <li>Качество: <strong>Ultra HD 4K</strong></li>
                    <li>Онлайн: <strong><span id="onlineCount">Загрузка...</span> чел.</strong></li>
                </ul>
            </div>

            <div class="action-container">
                <button class="btn-modern btn-glow" id="mute-btn">🔊 Включить звук</button>
                <button class="btn-modern" id="fs-btn">📺 Полный экран</button>
            </div>
        </div>
    </div>

    <script>
        // Секретный админ-ключ (?owner=true)
        const params = new URLSearchParams(window.location.search);
        const isAdmin = params.get('owner') === 'true';

        // ТВОЙ ПЛЕЙЛИСТ С ТАЙМИНГАМИ
        const playlist = [
            { id: 'byMMXeq0CcQ', title: 'Рик и морти', duration: 1440 }, 
            { id: '_23N3DmBRXk', title: 'Маша и медведь', duration: 4264 }, 
            { id: 'J5S3tU_mbi0', title: 'Симпсоны', duration: 3591 }  
        ];
        const totalDuration = playlist.reduce((sum, item) => sum + item.duration, 0);

        const introId = 'UbY3QIM69Ho'; 
        const introDuration = 11; 

        let isMuted = true;
        let lastLoadedVideoId = ""; 

        // Твоя маскировка ссылки от парсеров
        const p1 = "https://www.";
        const p2 = "youtube";
        const p3 = ".com/";
        const p4 = "embed/";
        const secureBaseUrl = p1 + p2 + p3 + p4;

        function startStream() {
            try {
                const currentUnixTime = Math.floor(Date.now() / 1000);
                let timeInCycle = currentUnixTime % totalDuration;

                let currentVideo = playlist[0];
                let startSeconds = 0;

                for (let i = 0; i < playlist.length; i++) {
                    if (timeInCycle < playlist[i].duration) {
                        currentVideo = playlist[i];
                        startSeconds = timeInCycle;
                        break;
                    }
                    timeInCycle -= playlist[i].duration;
                }

                document.getElementById('currentShowTitle').textContent = currentVideo.title;

                if (lastLoadedVideoId !== currentVideo.id) {
                    lastLoadedVideoId = currentVideo.id;
                    const playerContainer = document.getElementById('playerContainer');
                    
                    // ПОЛНЫЙ ФИКС: Исправлена опечатка ${currentVideo.id}
                    playerContainer.innerHTML = `<iframe src="${secureBaseUrl}${currentVideo.id}?start=${startSeconds}&autoplay=1&controls=1&rel=0&mute=${isMuted ? 1 : 0}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
                }
            } catch(e) { console.error("Ошибка стрима:", e); }
        }

        // Логика кнопки звука
        document.getElementById('mute-btn').addEventListener('click', () => {
            isMuted = !isMuted;
            document.getElementById('mute-btn').textContent = isMuted ? "🔇 Выключить звук" : "🔊 Включить звук";
            lastLoadedVideoId = ""; 
            startStream();
        });

        // Логика кнопки полного экрана
        document.getElementById('fs-btn').addEventListener('click', () => {
            const iframe = document.querySelector('#playerContainer iframe');
