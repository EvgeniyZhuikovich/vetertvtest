<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ветер ТВ — Тестовый эфир с чатом</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            font-size: 3.5rem;
            margin-top: 10px;
            margin-bottom: 5px;
            color: #38bdf8;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            letter-spacing: 2px;
        }
        .live-badge {
            background-color: #ef4444;
            color: white;
            padding: 4px 10px;
            font-weight: bold;
            border-radius: 4px;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 10px;
            text-transform: uppercase;
            animation: blink 1.5s infinite;
        }
        @keyframes blink { 50% { opacity: 0.5; } }
        .subtitle { font-size: 1.2rem; color: #94a3b8; margin-bottom: 25px; font-weight: 500; }
        
        .main-broadcast-layout {
            display: flex;
            max-width: 1200px;
            margin: 0 auto;
            gap: 20px;
            justify-content: center;
            align-items: flex-start;
        }

        .video-container {
            position: relative;
            flex: 1;
            max-width: 850px;
            height: 480px; 
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .video-mask { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 30; background: transparent; }
        iframe { width: 100% !important; height: 480px !important; border: none; display: block; }
        
        .chat-container {
            width: 340px;
            height: 480px;
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            text-align: left;
        }
        .chat-header {
            background: #334155;
            padding: 10px;
            font-weight: bold;
            color: #38bdf8;
            font-size: 1.1rem;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg {
            background: #111827;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            word-break: break-all;
        }
        .msg-author {
            color: #38bdf8;
            font-weight: bold;
            margin-right: 5px;
        }
        .chat-input-area {
            padding: 10px;
            background: #0f172a;
            border-top: 1px solid #334155;
            display: flex;
            gap: 8px;
        }
        .chat-input {
            flex: 1;
            background: #1e293b;
            border: 1px solid #334155;
            color: white;
            padding: 8px;
            border-radius: 6px;
            outline: none;
        }
        .chat-send-btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 0 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .chat-send-btn:hover { background: #0369a1; }

        @media (max-width: 1000px) {
            .main-broadcast-layout { flex-direction: column; align-items: center; }
            .chat-container { width: 100%; max-width: 850px; height: 400px; margin-top: 10px; }
        }

        .video-container:fullscreen iframe {
            width: 100vw !important; height: 56.25vw !important; min-height: 100vh !important; min-width: 177.77vh !important;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
        .video-container:fullscreen .video-mask { width: 100vw !important; height: 100vh !important; position: absolute; top: 0; left: 0; }

        .controls { margin-top: 20px; display: flex; justify-content: center; gap: 15px; }
        .btn {
            background-color: #0284c7; color: white; border: none; padding: 12px 24px;
            font-size: 1rem; font-weight: 600; cursor: pointer; border-radius: 8px;
            transition: all 0.2s ease; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .btn:hover { background-color: #0369a1; transform: translateY(-1px); }
        .online-counter {
            margin-top: 35px; font-size: 1.3rem; color: #94a3b8; background: #1e293b;
            display: inline-block; padding: 8px 20px; border-radius: 20px; border: 1px solid #334155;
        }
        .online-number { color: #22c55e; font-weight: bold; text-shadow: 0 0 10px rgba(34, 197, 94, 0.2); }
    </style>
</head>
<body>

    <h1>Ветер ТВ</h1>
    <div class="live-badge">Прямой эфир</div>
    <div class="subtitle" id="currentTrack">Загрузка эфира...</div>

    <div class="main-broadcast-layout">
        <div class="video-container">
            <div class="video-mask"></div>
            <iframe id="tv-player" allow="autoplay; fullscreen" allowfullscreen></iframe>
        </div>

        <div class="chat-container">
            <div class="chat-header">💬 Чат трансляции</div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" class="chat-input" placeholder="Напишите сообщение..." maxlength="150">
                <button class="chat-send-btn" id="sendBtn">➔</button>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn" id="muteBtn">🔇 Вкл звук</button>
        <button class="btn" id="fullscreenBtn">📺 Полный экран</button>
    </div>

    <div class="online-counter">
        • Онлайн: <span class="online-number" id="onlineCount">1</span> чел.
    </div>

    <script>
        // === АВТОНОМНАЯ ЛОГИКА ЧАТА (БЕЗ СЕРВЕРОВ) ===
        let myUsername = localStorage.getItem('chat_user') || "";
        const chatChannel = new BroadcastChannel('veter_tv_chat');

        // Загрузка сообщений из памяти браузера при старте
        function loadMessages() {
            const chatBox = document.getElementById('chatMessages');
            chatBox.innerHTML = "";
            const saved = JSON.parse(localStorage.getItem('chat_history') || "[]");
            saved.forEach(data => {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'msg';
                msgDiv.innerHTML = `<span class="msg-author">${escapeHTML(data.name)}:</span>${escapeHTML(data.text)}`;
                chatBox.appendChild(msgDiv);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Функция отправки сообщений
        function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            if (!myUsername) {
                const enteredName = prompt("Введите ваш ник для чата:", "");
                myUsername = enteredName ? enteredName.trim().substring(0, 15) : "Зритель_" + Math.floor(Math.random() * 100);
                localStorage.setItem('chat_user', myUsername);
            }

            const newMsg = { name: myUsername, text: text };
            
            // Сохраняем в локальную память
            const saved = JSON.parse(localStorage.getItem('chat_history') || "[]");
            saved.push(newMsg);
            if (saved.length > 50) saved.shift(); // Храним только последние 50
            localStorage.setItem('chat_history', JSON.stringify(saved));

            // Отправляем в другие вкладки
            chatChannel.postMessage(newMsg);

            loadMessages();
            input.value = "";
        }

        // Приём сообщений из соседних вкладок
        chatChannel.onmessage = function() {
            loadMessages();
        };

        // НАДЁЖНОЕ СЛУШАНИЕ НАЖАТИЯ ENTER
        document.getElementById('chatInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault(); // Защита от багов браузера
                sendMessage();
            }
        });

        document.getElementById('sendBtn').addEventListener('click', sendMessage);

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        // Инициализация чата
        loadMessages();

        // Имитация онлайна для тестов
        setInterval(() => {
            const num = Math.floor(Math.random() * (5 - 1 + 1)) + 1;
            document.getElementById('onlineCount').textContent = num;
        }, 10000);

        // === ТВ-РАСПИСАНИЕ И ПЛЕЕР ===
        const playlist = [
            { id: 'AlR0fQsm83Y', title: 'Смешарики. Начало', duration: 5400 },
            { id: 'xfFu4P2FZZc', title: 'Смешарики. Легенда о золотом драконе', duration: 4790 },
            { id: 'dQw4w9WgXcQ', title: 'Смешарики. ДежаВю', duration: 5100 },
            { id: '1vBgKm9qhhM', title: 'Смешарики снимают кино', duration: 5212 }
        ];
        
        const introId = 'UbY3QIM69Ho';
        const totalDuration = playlist.reduce((sum, item) => sum + item.duration, 0);
        let isMuted = true;

        const p1 = "https://www.";
        const p2 = "youtube";
        const p3 = ".com/";
