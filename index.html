<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ветер ТВ — Тест</title>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; padding: 20px; }
        .main-layout { display: flex; max-width: 1400px; margin: 0 auto; gap: 20px; justify-content: center; }
        .left-auth-column { width: 300px; }
        .center-player-column { flex: 1; max-width: 750px; }
        .right-chat-column { width: 300px; }
        .auth-panel, .account-status, .chat-container { background: #1e293b; border: 1px solid #334155; padding: 15px; border-radius: 12px; text-align: left; }
        .video-container { width: 100%; height: 430px; background: #000; border-radius: 12px; overflow: hidden; }
        iframe { width: 100% !important; height: 430px !important; border: none; }
        .form-vertical { display: flex; flex-direction: column; gap: 10px; }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group input { background: #0f172a; border: 1px solid #334155; color: white; padding: 8px; border-radius: 6px; outline: none; }
        .submit-btn, .btn { background: #0284c7; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; }
        .submit-btn { background: #22c55e; }
        .chat-container { height: 500px; display: flex; flex-direction: column; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 5px; font-size: 0.9rem; }
        .chat-lock-overlay { color: #94a3b8; text-align: center; padding-top: 50px; }
        .chat-input-area { display: flex; gap: 5px; margin-top: 10px; }
        .chat-input { flex: 1; background: #1e293b; border: 1px solid #334155; color: white; padding: 8px; border-radius: 6px; }
        @media (max-width: 1100px) {
            .main-layout { flex-direction: column; align-items: center; }
            .left-auth-column, .center-player-column, .right-chat-column { width: 100%; max-width: 100%; }
            .center-player-column { order: 1; }
            .left-auth-column { order: 2; }
            .right-chat-column { order: 3; }
            .video-container, iframe { height: 240px !important; }
        }
    </style>
    <script src="https://jsdelivr.net"></script>
</head>
<body>
    <h1 style="text-align:center; color:#38bdf8;">Ветер ТВ — Тест</h1>
    <div class="main-layout">
        <div class="left-auth-column">
            <div id="authContainer">
                <div class="auth-panel" id="authStep1Panel">
                    <h3>🔐 Авторизация аккаунта</h3>
                    <div class="form-vertical">
                        <div class="form-group"><label>Почта:</label><input type="email" id="authEmail" placeholder="example@mail.ru" required></div>
                        <div class="form-group"><label>Никнейм в чате:</label><input type="text" id="authNick" placeholder="Твой ник" required></div>
                        <div class="form-group"><label>Пароль:</label><input type="password" id="authPass" placeholder="••••••••" required></div>
                        <button class="submit-btn" id="nextStepBtn">Зарегистрироваться/войти</button>
                    </div>
                </div>
                <div class="auth-panel" id="authStep2Panel" style="display: none;">
                    <h3>📧 Подтверждение от Ветер ТВ</h3>
                    <p style="font-size:0.8rem; color:#94a3b8;">На вашу почту отправлен секретный 4-значный код.</p>
                    <div class="form-vertical">
                        <div class="form-group"><label>Код подтверждения:</label><input type="text" id="authCode" placeholder="0000" maxlength="4" style="text-align: center; font-weight: bold; font-size: 1.2rem;"></div>
                        <button class="submit-btn" id="confirmCodeBtn" style="background: #38bdf8;">Подтвердить код</button>
                        <button class="btn" id="backToStep1" style="background: #475569;">Назад</button>
                    </div>
                </div>
                <div class="account-status" id="authSuccessPanel" style="display: none;">
                    <span style="color: #22c55e; font-weight: bold;">✓ Вы вошли в аккаунт</span>
                    <p>Пользователь: <span id="lblActiveNick" style="font-weight: bold;"></span></p>
                    <button class="btn" onclick="logoutUser()" style="background: #ef4444;">Выйти из профиля</button>
                </div>
            </div>
        </div>
        <div class="center-player-column">
            <p id="currentTrack" style="text-align:center; color:#94a3b8; font-weight: bold;">Синхронизация эфира...</p>
            <div class="video-container"><iframe id="tv-player" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
            <div style="display:flex; gap:10px; margin-top:10px;"><button class="btn" id="muteBtn">🔇 Включить звук</button></div>
            <p style="color:#94a3b8;">👀 Онлайн на сайте: <span id="onlineCount" style="color:#22c55e; font-weight:bold;">1</span> чел.</p>
        </div>
        <div class="right-chat-column">
            <div class="chat-container">
                <h3 style="margin:0 0 10px 0; color:#38bdf8;">💬 ЧАТ ТРАНСЛЯЦИИ</h3>
                <div class="chat-messages" id="chatMessages"><div class="chat-lock-overlay" id="chatLockOverlay">Зарегистрируйтесь слева, чтобы открыть чат.</div></div>
                <div class="chat-input-area">
                    <input type="text" class="chat-input" id="chatInput" placeholder="Сообщение..." disabled>
                    <button class="btn" id="sendMsgBtn" style="width:auto; padding:0 15px;" disabled>➡</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const EMAILJS_PUBLIC_KEY = "xrlQMiO5gTxbKJfVL";
        const EMAILJS_SERVICE_ID = "vetertv"; 
        const EMAILJS_TEMPLATE_ID = "template_hm6ccho";

        emailjs.init(EMAILJS_PUBLIC_KEY);

        let generatedCode = ""; 
        let tempNickname = "";
        let isMuted = true; 
        let lastLoadedVideoId = ""; 

        function checkSecurityPolicies() {
            const savedNick = localStorage.getItem('vetertv_nickname');
            const savedTime = localStorage.getItem('vetertv_auth_time');
            const savedToken = localStorage.getItem('vetertv_auth_device_token');
            const currentToken = sessionStorage.getItem('vetertv_device_unique_session');

            if (savedNick && savedTime && savedToken) {
                if ((Date.now() - parseInt(savedTime)) / (1000 * 60 * 60) >= 72) {
                    logoutUser("Время вашей сессии истекло (72 ч). Перевойдите."); 
                    return;
                }
                if (savedToken !== currentToken && currentToken) {
                    logoutUser("Сессия безопасности обновлена. Пожалуйста, авторизуйтесь заново."); 
                    return;
                }
                activateAuthorizedUI(savedNick);
            }
        }

        function logoutUser(reason) {
            if(reason) alert(reason);
            localStorage.removeItem('vetertv_nickname');
            localStorage.removeItem('vetertv_auth_time');
            localStorage.removeItem('vetertv_auth_device_token');
            location.reload();
        }

        function activateAuthorizedUI(nickname) {
            document.getElementById('authStep1Panel').style.display = 'none';
            document.getElementById('authStep2Panel').style.display = 'none';
            document.getElementById('authSuccessPanel').style.display = 'block';
            document.getElementById('lblActiveNick').textContent = nickname;
            const lock = document.getElementById('chatLockOverlay'); if (lock) lock.remove();
            document.getElementById('chatInput').disabled = false;
            document.getElementById('sendMsgBtn').disabled = false;
            loadLocalChat();
        }

        function initAutonomousOnline() {
            if (!sessionStorage.getItem('vetertv_device_unique_session')) {
                sessionStorage.setItem('vetertv_device_unique_session', Math.random().toString(36).substring(2) + Date.now().toString(36));
            }
            const myTabId = sessionStorage.getItem('vetertv_device_unique_session');
            const channel = new BroadcastChannel('vetertv_pure_tab_bus');
            let activeTabs = {}; 
            activeTabs[myTabId] = Date.now();

            channel.onmessage = (e) => {
                if (e.data.type === 'ping' || e.data.type === 'pong') { activeTabs[e.data.id] = Date.now(); updateUI(); }
                else if (e.data.type === 'disconnect') { delete activeTabs[e.data.id]; updateUI(); }
            };
            function updateUI() {
                const now = Date.now(); for (let id in activeTabs) { if (now - activeTabs[id] > 5000) delete activeTabs[id]; }
                document.getElementById('onlineCount').textContent = Object.keys(activeTabs).length || 1;
            }
            window.addEventListener('beforeunload', () => { channel.postMessage({ type: 'disconnect', id: myTabId }); });
            setInterval(() => { channel.postMessage({ type: 'ping', id: myTabId }); updateUI(); }, 2000);
            channel.postMessage({ type: 'ping', id: myTabId }); updateUI();
        }

        const playlist = [
            { id: 'BWVvUc9yl_0', title: '🥷 НИНДЗЯГО — Сезон 5 Серия 1 (Ветер перемен)', duration: 1321 },
            { id: 'o10B-zfrnSI', title: '🥷 НИНДЗЯГО — Сезон 5 Серия 2 (Второе видео)', duration: 1321 }
        ];
        const totalDuration = playlist.reduce((sum, item) => sum + item.duration, 0);

        function updateLiveBroadcast() {
            const playerIframe = document.getElementById('tv-player');
            if (!playerIframe) return;

            let timeInCycle = Math.floor(Date.now() / 1000) % totalDuration;
            let currentMovie = null;

            for (let i = 0; i < playlist.length; i++) {
                if (timeInCycle < playlist[i].duration) {
                    currentMovie = { id: playlist[i].id, title: playlist[i].title, startFrom: Math.floor(timeInCycle) };
                    break;
                }
                timeInCycle -= playlist[i].duration;
            }

            if (currentMovie && lastLoadedVideoId !== currentMovie.id) {
                lastLoadedVideoId = currentMovie.id;
                playerIframe.src = `https://youtube.com{currentMovie.id}?autoplay=1&start=${currentMovie.startFrom}&mute=${isMuted?1:0}&controls=0&enablejsapi=1`;
                document.getElementById('currentTrack').textContent = 'В эфире: ' + currentMovie.title;
            }
        }

        initAutonomousOnline();
        checkSecurityPolicies();
        updateLiveBroadcast();
        setInterval(updateLiveBroadcast, 1000);

        document.getElementById('nextStepBtn').addEventListener('click', function() {
            const email = document.getElementById('authEmail').value.trim();
            const nick = document.getElementById('authNick').value.trim();
            const pass = document.getElementById('authPass').value.trim();

            if (email && nick && pass) {
                tempNickname = nick; 
                generatedCode = Math.floor(1000 + Math.random() * 9000).toString();
                this.innerText = "Отправка кода..."; this.disabled = true;
                
                emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, { to_email: email, username: nick, code: generatedCode })
                    .then(() => { 
                        document.getElementById('authStep1Panel').style.display = 'none'; 
                        document.getElementById('authStep2Panel').style.display = 'block'; 
                    })
                    .catch(() => { alert("Ошибка службы писем EmailJS! Проверьте квоты."); })
                    .finally(() => { this.innerText = "Зарегистрироваться/войти"; this.disabled = false; });
            } else { alert("Заполните почту, никнейм и пароль!"); }
        });

        document.getElementById('confirmCodeBtn').addEventListener('click', () => {
            if (document.getElementById('authCode').value.trim() === generatedCode) {
                const deviceToken = sessionStorage.getItem('vetertv_device_unique_session') || "token_1";
                localStorage.setItem('vetertv_nickname', tempNickname);
                localStorage.setItem('vetertv_auth_time', Date.now().toString());
                localStorage.setItem('vetertv_auth_device_token', deviceToken);
                activateAuthorizedUI(tempNickname);
            } else { alert("Неверный код от Ветер ТВ!"); }
        });
        document.getElementById('backToStep1').addEventListener('click', () => { document.getElementById('authStep2Panel').style.display = 'none'; document.getElementById('authStep1Panel').style.display = 'block'; });

        function loadLocalChat() {
            const chatMessages = document.getElementById('chatMessages');
            let messages = JSON.parse(localStorage.getItem('vetertv_chat_history')) || [];
            chatMessages.innerHTML = messages.map(msg => `<div><b>${msg.name}:</b> ${msg.text}</div>`).join('');
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        function sendMessage() {
            const input = document.getElementById('chatInput'); const text = input.value.trim(); const nickname = localStorage.getItem('vetertv_nickname');
            if (text && nickname) {
                let messages = JSON.parse(localStorage.getItem('vetertv_chat_history')) || []; messages.push({ name: nickname, text: text });
                if (messages.length > 50) messages.shift(); 
                localStorage.setItem('vetertv_chat_history', JSON.stringify(messages)); loadLocalChat(); input.value = "";
                new BroadcastChannel('vetertv_pure_tab_bus').postMessage({ type: 'new_msg' });
            }
        }
        new BroadcastChannel('vetertv_pure_tab_bus').onmessage = (e) => { if(e.data.type === 'new_msg') loadLocalChat(); };
        document.getElementById('sendMsgBtn').addEventListener('click', sendMessage);
        document.getElementById('chatInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        document.getElementById('muteBtn').addEventListener('click', function() {
            const playerIframe = document.getElementById('tv-player'); isMuted = !isMuted;
            this.innerHTML = isMuted ? "🔇 Включить звук" : "🔊 Выключить звук";
            if (playerIframe && playerIframe.contentWindow) {
                playerIframe.contentWindow.postMessage(`{"event":"command","func":"${isMuted?'mute':'unMute'}","args":""}`, '*');
            }
        });
    </script>
</body>
</html>
